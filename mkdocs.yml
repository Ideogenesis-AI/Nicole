site_name: Nicole Documentation
site_description: A symmetry-aware tensor library for quantum many-body physics
site_author: Changkai Zhang
site_url: https://ideogenesis-ai.github.io/Nicole/
repo_name: Ideogenesis-AI/Nicole
repo_url: https://github.com/Ideogenesis-AI/Nicole
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2025-2026 Changkai Zhang

theme:
  name: material
  logo: images/nicole.png
  favicon: images/nicole.png
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/link
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/toggle-switch-off
        name: Switch to system preference
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - content.action.view
  icon:
    repo: fontawesome/brands/github

nav:
  - Getting Started:
    - What is Nicole?: getting-started/what-is-nicole.md
    - Installation: getting-started/installation.md
    - Core Concepts: getting-started/core-concepts.md
    - Quick Examples: getting-started/quick-examples.md
    - Development:
      - Contributing: getting-started/contributing.md
      - Changelog: getting-started/changelog.md
  - API Reference:
    - api/index.md
    - Core Classes:
      - Tensor: api/core/tensor.md
      - Index: api/core/index-class.md
      - Sector: api/core/sector.md
      - Direction: api/core/direction.md
    - Creating Tensors:
      - zeros: api/creation/zeros.md
      - random: api/creation/random.md
      - identity: api/creation/identity.md
      - isometry: api/creation/isometry.md
      - isometry_n: api/creation/isometry_n.md
    - Manipulation:
      - conjugate: api/manipulation/conjugate.md
      - permute: api/manipulation/permute.md
      - transpose: api/manipulation/transpose.md
      - retag: api/manipulation/retag.md
      - subsector: api/manipulation/subsector.md
      - merge_axes: api/manipulation/merge_axes.md
    - Arithmetic:
      - Basic Operations: api/arithmetic/addition.md
      - Direct Sum (oplus): api/arithmetic/oplus.md
      - diag: api/arithmetic/diag.md
      - inv: api/arithmetic/inv.md
    - Contraction:
      - contract: api/contraction/contract.md
      - trace: api/contraction/trace.md
    - Decomposition:
      - decomp: api/decomposition/decomp.md
      - svd: api/decomposition/svd.md
    - Symmetry Groups:
      - Overview: api/symmetry/overview.md
      - U1Group: api/symmetry/u1-group.md
      - Z2Group: api/symmetry/z2-group.md
      - ProductGroup: api/symmetry/product-group.md
    - Utilities:
      - Display: api/utilities/display.md
      - Blocks: api/utilities/blocks.md
      - load_space: api/utilities/load_space.md
  - Examples:
    - examples/index.md
    - Basic Usage:
      - First Tensor: examples/basic/first-tensor.md
      - Arithmetic: examples/basic/arithmetic.md
      - Indexing: examples/basic/indexing.md
    - Symmetries:
      - U(1) Examples: examples/symmetries/u1-examples.md
      - Z(2) Examples: examples/symmetries/z2-examples.md
      - Product Groups: examples/symmetries/product-examples.md
    - Operations:
      - Contraction: examples/operations/contraction-examples.md
      - Decomposition: examples/operations/decomposition-examples.md
      - Manipulation: examples/operations/manipulation-examples.md
    - Advanced:
      - Build Operators: examples/advanced/build-operators.md
      - Load Space: examples/advanced/load-space-examples.md
      - Performance: examples/advanced/performance.md
  # - Tutorials:
  #   - tutorials/index.md

plugins:
  - search:
      lang: en
  - markdown-exec
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago
      exclude:
        - index.md
  - git-committers:
      repository: Ideogenesis-AI/Nicole
      branch: stable
      exclude:
        - index.md
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            docstring_section_style: table
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_object_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            group_by_category: true
            show_category_heading: true
            show_if_no_docstring: false
            annotations_path: brief
            line_length: 80
            show_signature_annotations: true
            separate_signature: true
            merge_init_into_class: true
            docstring_options:
              ignore_init_summary: false
            filters:
              - "!^_"  # exclude private members

markdown_extensions:
  # Python Markdown
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  
  # Python Markdown Extensions
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Ideogenesis-AI/Nicole
      name: Nicole on GitHub
    - icon: fontawesome/solid/building
      link: https://github.com/Ideogenesis-AI
      name: Ideogenesis-AI Organization
    - icon: fontawesome/brands/python
      link: https://www.python.org
      name: Python
    - icon: simple/numpy
      link: https://numpy.org
      name: NumPy
  version:
    provider: mike
  analytics:
    provider: google
    property: G-XXXXXXXXXX
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: This page was helpful
          data: 1
          note: >-
            Thanks for your feedback!
        - icon: material/emoticon-sad-outline
          name: This page could be improved
          data: 0
          note: >-
            Thanks for your feedback! Help us improve this page by
            raising issues in our <a href="https://github.com/Ideogenesis-AI/Nicole/issues" target="_blank" rel="noopener">repository</a>.

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
